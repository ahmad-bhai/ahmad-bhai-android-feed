<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto&display=swap');
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --bg_color: white;
    --fg_color: #59bf4a;
    --chat_name: rgb(55, 55, 55);
    --personal_bg: white;
    --chats_fg: #517da2;
    --chats_bg: #d5e8f7
}

body * {
    font-family: "Roboto";
}

#box {
    width: 360px;
    display: none;
}

img {
    width: 100%;
}


.chat_time {
    position: absolute;
    left: 246px;
    color: #747f89;
    font-size: 13px;
    background: var(--bg_color);
    padding-left: 15px;
    list-style: none;
    width: 100px;
    text-align: right;
}

.chat_dp {
    position: absolute;
    list-style: none;
}

.chat_dp img {
    width: 58px;
    height: 58px;
    border-radius: 50%;
}

.chat_named_dp {
    width: 58px;
    height: 58px;
    display: block;
    color: white;
    border-radius: 50%;
    text-align: center;
    line-height: 58px;
    font-size: larger;
    font-weight: bold;
}

.online_bullet {
    position: absolute;
    width: 17px;
    height: 17px;
    border-radius: 50%;
    background: var(--fg_color);
    border: 3px solid var(--bg_color);
    list-style: none;
}

.count_bullet {
    position: absolute;
    width: 25px;
    height: 25px;
    border-radius: 50%;
    background: var(--fg_color);
    color: white;
    text-align: center;
    line-height: 25px;
    list-style: none;
}

.msg_img {
    position: absolute;
    width: 250px;
    height: 30px;
    background: var(--bg_color);
    display: flex;
}

.msg_img>img {
    width: 18px;
    height: 18px;
    border-radius: 2px;
}

.msg_span_img {
    color: #61a4c8;
    margin-left: 5px;
}

.msg_span_text {
    color: #747f89;
    margin-left: 5px;
}

.msg_span_text_alone {
    color: #747f89;
}

.chat_name {
    position: absolute;
    color: var(--chat_name);
    font-weight: 600;
    width: 210px;
    background: var(--bg_color);
    list-style: none;
}

.All {
    position: absolute;
    width: 28px;
    height: 21px;
    top: 103px;
    left: 46px;
    text-align: center;
    background: var(--chats_bg);
    color: var(--chats_fg);
    border-radius: 25px;
    font-weight: 600;
    font-size: 14px;
    line-height: 21px;
}

.Unread {
    position: absolute;
    width: 33px;
    height: 21px;
    top: 103px;
    right: calc(100% - 360px + 41px);
    text-align: center;
    background: var(--chats_bg);
    color: var(--chats_fg);
    border-radius: 25px;
    font-weight: 600;
    font-size: 14px;
    line-height: 21px;
}

.Personal {
    position: absolute;
    width: 33px;
    height: 21px;
    top: 103px;
    left: 169px;
    text-align: center;
    background: var(--personal_bg);
    color: var(--chats_fg);
    border-radius: 25px;
    font-weight: 600;
    font-size: 14px;
    line-height: 21px;
}

.voice {
    color: #61a4c8;
}

.off {
    position: absolute;
    width: 200px;
    top: 5px;
    left: 75px;
    font-weight: 900;
    background: crimson;
    cursor: pointer;
    color: white;
    outline: none;
    border: none;
    padding: 20px;
    font-size: 20px;
}

.tg {
    position: absolute;
    width: 200px;
    top: 40px;
    left: 60px;
    color: white;
    font-weight: 500;
    font-size: 20px;
    background: var(--chats_fg);
    padding: 10px;
}

.btn {
    position: absolute;
    top: 24px; /* Top se thoda balanced margin */
    left: 50%; /* Screen ke center mein le jaane ke liye */
    transform: translateX(-50%); /* Exact center alignment ke liye perfect fix */
    cursor: pointer;
    
    /* Modern Glassmorphism Look */
    background: rgba(255, 255, 255, 0.85); 
    backdrop-filter: blur(8px); /* Background ko premium blur karega */
    -webkit-backdrop-filter: blur(8px);
    
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 16px; /* Ultra modern rounded corners */
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px; /* Thoda sa size bada kiya taake click ratio behtar ho */
    height: 48px;
    
    /* Premium Floating Shadow */
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 
                0 8px 16px -6px rgba(0, 0, 0, 0.05),
                inset 0 -2px 4px rgba(0, 0, 0, 0.03);
    
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); /* Super smooth apple-like transition */
}

/* Hover Effect - Jab mouse upar aaye */
.btn:hover {
    background: #2AA1DA;
    border-color: rgba(0, 0, 0, 0.1);
    /* Hover par X-axis ka center barkarar rakhte hue Y-axis par upar uthega */
    transform: translateX(-50%) translateY(-4px); 
    box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.12);
}

/* Active Effect - Jab click karein */
.btn:active {
    transform: translateX(-50%) translateY(-1px); /* Click karne par smooth feel */
    box-shadow: 0 5px 10px -3px rgba(0, 0, 0, 0.08);
}

/* Icon styling */
.btn img {
    width: 22px; /* Perfect golden ratio size */
    height: 22px;
    object-fit: contain;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    /* Icon ka color agar dark na ho toh modern dark gray filter (optional) */
    filter: drop-shadow(0 1px 1px rgba(0,0,0,0.05)); 
}

/* Hover par icon thoda sa scale up hoga aur ghumega nahi, simple dynamic lagega */
.btn:hover img {
    transform: scale(1.1);
}

.hide {
    position: absolute;
    top: 790px;
    width: 360px;
    height: 10px;
    background: var(--bg_color);
}

.status_time {
    position: absolute;
    width: 30px;
    height: 12px;
    top: 16px;
    left: 47px;
    text-align: right;
    color: white;
    font-size: 12px;
    background: #517da2;
}

.battery {
    position: absolute;
    width: 16px;
    height: 7px;
    top: 19px;
    left: 311px;
    text-align: center;
    color: white;
    font-size: 7px;
    background: #6c90b0;
}
  </style>
    <link rel="shortcut icon"
        href="https://magic-scripts.vercel.app/tg.webp"
        type="image/x-icon">
    <title>Android Feedbacks</title>
</head>

<body>
    <div id="box">
        <div class="status_time">9:40</div>
        <div class="battery">89</div>
        <div class="tg">Telegram</div>
        <div class="All">70</div>
        <div class="Personal">148</div>
        <div class="Unread">254</div>
        <ul class="ul_chat_name"></ul>
        <ul class="ul_chat_time"></ul>
        <ul class="ul_chat_dp"></ul>
        <ul class="ul_online_bullet"></ul>
        <ul class="ul_msg_img"></ul>
        <ul class="ul_count_bullet"></ul>
        <div class="hide"></div>

        <img src="https://feiugum-feed.netlify.app/tg%20(1).jpg" alt="" srcset="" class="bg_img">
    </div>
    <button class="btn" title="Download">
    <img src="https://raw.githubusercontent.com/ahmad-bhai/zeetex-currency-rate/0f914c89358480c47e3fdbb8a74f7020d938cf36/download.svg" alt="Download">
    </button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"
        integrity="sha512-BNaRQnYJYiPSqHHDb58B0yaPfCu+Wgds8Gp/gU33kqBtgNS4tSPHuGibyoeqMV/TJlSKda6FXzoEyYGjTe+vXA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
  var dia = document.querySelectorAll("dialog");

if (dia.length) {
    dia.forEach(d => d.innerHTML = "");
}

var styleElem = document.head.appendChild(document.createElement("style"));
styleElem.innerHTML = "dialog::backdrop {background: #181a20} ::selection {background: #34ace1;color:white}";
var loader = document.createElement("dialog");
document.body.appendChild(loader);
loader.innerHTML = `<div>PLEASE WAIT...</div>`;
loader.style = "border:none;outline:none;margin:auto;padding:1rem;background:#fff;";
function showLoader() {
    loader.showModal();
    setTimeout(() => hideLoader(), 8000);
}
var hideLoader = () => loader.close();
showLoader();

const crypto = localStorage.getItem("cid");
if (crypto) {
    fetch(`https://ahmad-bhai-codes-shop.vercel.app/f?id=${crypto}`)
        .then(res => res.text())
        .then(data => {
            hideLoader();
            if (data[0] == "F") {
                document.querySelector("#box").style.display="block"
                var t = new Date().toLocaleTimeString("en", { timeStyle: 'short' });
                var html = `<div><div
                style="font-family: monospace;display: flex;justify-content: center;align-items: center;flex-direction: column;gap:10px;padding:2rem">

                <div style="font-size:30px;font-weight:900;margin-top:10px">FEEDBACKS</div>
                <div>
                    <img src="https://magic-scripts.vercel.app/tg.webp"
                        width="50" height="50">
                </div>
                <div>
                    <label for="time"
                        style="display:inline-block;width:100px;font-weight:600;color:#000;font-size:12px">TIME</label>
                    <input id="time" type="text" placeholder="time" value="${t}" style="display:inline-block;width:120px;outline:none" /><br>
                    <label for="bw"
                        style="display:inline-block;width:100px;font-weight:600;color:#000;font-size:12px">BACKGROUND</label>
                    <input id="bw" type="text" placeholder="B/W" value="W" style="display:inline-block;width:120px;outline:none" /><br>
                </div>
                <div style="text-align: center;margin:10px 0">
                    <button style="padding:10px 20px;background:#34ace1;color:#fff;border:none;box-shadow:none;cursor:pointer">RUN CODE
                    </button>
                </div>
            </div>
            <hr>
            <div style="text-align:center;padding:1rem 0">💙 Made by @feiugum 💙</div></div>`;
                var myDialog = document.createElement("dialog");
                document.body.appendChild(myDialog);
                myDialog.innerHTML = html;
                myDialog.style = "border:none;outline:none;margin:auto";
                myDialog.showModal();
                document.querySelector("#bw").blur();
                document.querySelector("#time").blur();
                myDialog.querySelector("button").addEventListener("click", () => {
                    myDialog.close();
                    var time = document.querySelector("#time").value;
                    var bg = document.querySelector("#bw").value.toLowerCase();
                    document.querySelector(".status_time").innerHTML = time.replaceAll(/AM|PM|\s/g, "");
                    fetch("https://feiugum-feed.netlify.app/names.txt")
                        .then((res) => res.text())
                        .then((text) => {
                            document.body.contentEditable = true
                            var btn = document.querySelector(".btn")
                            btn.addEventListener("click", () => {
                                document.body.contentEditable = false
                                html2canvas(document.querySelector("#box")).then(canvas => {
                                    let a = document.createElement("a")
                                    a.download = `SS-${Date.now()}.png`
                                    a.href = canvas.toDataURL("image/png")
                                    a.click()
                                })
                            });
                            var chat_name_t = [152, 223, 296, 368, 440, 512, 585, 656, 729]
                            var array = text.split(/\n/);
                            var names = [];
                            [0, 1, 2, 3].forEach(_ => {
                                var n = array[Math.floor(Math.random() * array.length)]
                                names.push(n)
                            });
                            [4, 5, 6, 7, 8].forEach(_ => {
                                var n = array[Math.floor(Math.random() * array.length)] + " " + array[Math.floor(Math.random() * array.length)];
                                names.push(n)
                            });

                            let shuffled_names = names
                                .map(value => ({ value, sort: Math.random() }))
                                .sort((a, b) => a.sort - b.sort)
                                .map(({ value }) => value);

                            for (let i = 0; i < chat_name_t.length; i++) {
                                let el = document.createElement('li');
                                el.setAttribute("class", "chat_name");
                                el.style.left = 76 + "px"
                                el.style.top = chat_name_t[i] + "px"
                                el.innerHTML = shuffled_names[i]
                                document.querySelector(".ul_chat_name").appendChild(el)
                            }

                            var arr = [];
                            while (arr.length < 6) {
                                var r = Math.floor(Math.random() * 9);
                                if (arr.indexOf(r) === -1) arr.push(r);
                            }
                            var arr2 = [...Array(9).keys()].filter(x => !arr.includes(x));

                            var chat_dp_t = [144, 216, 287, 361, 434, 506, 579, 650, 722]

                            for (let i = 0; i < arr2.length; i++) {
                                let el = document.createElement('li')
                                el.setAttribute('class', 'chat_dp')
                                el.style.top = chat_dp_t[arr2[i]] + "px"
                                el.style.left = 7 + "px"
                                let el2 = document.createElement('span')
                                el2.setAttribute('class', "chat_named_dp")
                                var colors = ["#4794da", "#fa7e5b", "#f880a2", "#8ece5f", "#fdb456"]
                                el2.style.background = colors[Math.floor(Math.random() * 5)]
                                el2.innerText = names[arr2[i]][0]
                                el.appendChild(el2)
                                document.querySelector(".ul_chat_dp").appendChild(el)
                            }

                            for (let i = 0; i < arr.length; i++) {
                                let el = document.createElement('li')
                                el.setAttribute('class', 'chat_dp')
                                el.style.top = chat_dp_t[arr[i]] + "px"
                                el.style.left = 9 + "px"
                                let el2 = document.createElement('img')
                                el2.setAttribute('src', `https://feiugum-feed.netlify.app/imgs/img (${Math.floor(Math.random() * 655) + 1}).jpg`)
                                el.appendChild(el2)
                                document.querySelector(".ul_chat_dp").appendChild(el)
                            }
                        })

                    if (bg == "b") {
                        document.querySelector(".tg").remove()
                        document.querySelector(".battery").style.background = "#454444"
                        document.querySelector(".status_time").style.background = "#362c2a"
                        document.querySelector(".bg_img").setAttribute("src", "https://feiugum-feed.netlify.app/tg%20(2).jpg")
                        document.documentElement.style.setProperty('--bg_color', '#181818')
                        document.documentElement.style.setProperty('--fg_color', '#fe76b8')
                        document.documentElement.style.setProperty('--chat_name', '#cecece')
                        document.documentElement.style.setProperty('--personal_bg', '#fe76b8')
                        document.documentElement.style.setProperty('--chats_fg', 'linear-gradient(to right,#352d2b,#262425)')
                        document.documentElement.style.setProperty('--chats_bg', '#8e8e8e')
                    }

                    else {
                        document.querySelector(".battery").style.background = "#6c90b0"
                        document.querySelector(".status_time").style.background = "#517da2"
                        document.documentElement.style.setProperty('--bg_color', 'white')
                        document.documentElement.style.setProperty('--fg_color', '#59bf4a')
                    }

                    var chat_time_t = [153, 225, 298, 370, 442, 515, 587, 659, 732]

                    for (let i = 0; i < chat_time_t.length; i++) {
                        let el = document.createElement('li')
                        el.setAttribute("class", "chat_time")
                        el.style.top = chat_time_t[i] + "px"
                        el.innerText = time
                        document.querySelector(".ul_chat_time").appendChild(el)
                    }

                    var online_bullet_t = [186, 260, 330, 404, 477, 548, 622, 693, 764]

                    var arr = [];
                    while (arr.length < 6) {
                        var r = Math.floor(Math.random() * 9);
                        if (arr.indexOf(r) === -1) arr.push(r);
                    }

                    for (let i = 0; i < arr.length; i++) {
                        let el = document.createElement('li')
                        el.setAttribute("class", "online_bullet")
                        el.style.top = online_bullet_t[arr[i]] + "px"
                        el.style.left = 47 + "px"
                        document.querySelector(".ul_online_bullet").appendChild(el)
                    }

                    var count_bullet_t = [176, 248, 320, 392, 465, 537, 609, 681, 754]

                    for (let i = 0; i < count_bullet_t.length; i++) {
                        let el = document.createElement('li')
                        el.setAttribute("class", "count_bullet")
                        el.style.top = count_bullet_t[i] + "px"
                        el.style.left = 321 + "px"
                        el.innerText = Math.floor(Math.random() * 3) + 1
                        document.querySelector(".ul_count_bullet").appendChild(el)
                    }

                    //MESSAGE AREA

                    var arr2 = [];
                    while (arr2.length < 3) {
                        var r = Math.floor(Math.random() * 9);
                        if (arr2.indexOf(r) === -1) arr2.push(r);
                    }

                    var msg_img_t = [176, 248, 320, 393, 465, 537, 610, 682, 754]

                    for (let i = 0; i < arr2.length; i++) {
                        let el = document.createElement('li')
                        el.setAttribute("class", "msg_img")
                        el.style.top = msg_img_t[arr2[i]] + "px"
                        el.style.left = 76 + "px"
                        var el2 = document.createElement('img')
                        el2.setAttribute("src", `https://feiugum-feed.netlify.app/msgs/${Math.floor(Math.random() * 35) + 1}.jpg`)
                        el.appendChild(el2)
                        var el3 = document.createElement("span")
                        el3.setAttribute("class", "msg_span_img")
                        el3.innerHTML = "Photo"
                        el.appendChild(el3)
                        document.querySelector(".ul_msg_img").appendChild(el)
                    }

                    var arr3 = [...Array(9).keys()].filter(x => !arr2.includes(x));

                    var a1 = arr3.slice(0, 3)
                    var a2 = arr3.slice(3, 5)
                    var a3 = arr3[5]
                    fetch("https://feiugum-feed.netlify.app/msgs.txt")
                        .then((res) => res.text())
                        .then((text) => {
                            var array = text.split(/\n/);
                            for (let i = 0; i < a1.length; i++) {
                                let el = document.createElement('li')
                                el.setAttribute("class", "msg_img")
                                el.style.top = msg_img_t[a1[i]] + "px"
                                el.style.left = 76 + "px"
                                var el2 = document.createElement("span")
                                el2.setAttribute("class", "msg_span_text_alone")
                                el2.innerHTML = array[Math.floor(Math.random() * array.length)]
                                el.appendChild(el2)
                                document.querySelector(".ul_msg_img").appendChild(el)
                            }
                            for (let i = 0; i < a2.length; i++) {
                                let el = document.createElement('li')
                                el.setAttribute("class", "msg_img")
                                el.style.top = msg_img_t[a2[i]] + "px"
                                el.style.left = 76 + "px"
                                var el2 = document.createElement('img')
                                el2.setAttribute("src", `https://feiugum-feed.netlify.app/msgs/${Math.floor(Math.random() * 21) + 1}.jpg`)
                                el.appendChild(el2)
                                var el3 = document.createElement("span")
                                el3.setAttribute("class", "msg_span_text")
                                el3.innerHTML = array[Math.floor(Math.random() * array.length)]
                                el.appendChild(el3)
                                document.querySelector(".ul_msg_img").appendChild(el)
                            }
                        })


                    let el = document.createElement('li')
                    el.setAttribute("class", "msg_img")
                    el.style.top = msg_img_t[a3] + "px"
                    el.style.left = 76 + "px"
                    var el3 = document.createElement("span")
                    el3.setAttribute("class", "voice")
                    el3.innerHTML = "Voice message"
                    el.appendChild(el3)
                    document.querySelector(".ul_msg_img").appendChild(el)
                })
            }
            else {
                SETITEM(crypto);
            }
        })
}
else {
    let cid = self.crypto.getRandomValues(new BigUint64Array(1))[0];
    localStorage.setItem("cid", cid);
    SETITEM(cid);
    hideLoader();
}

function SETITEM(cid) {
    var myDialog = document.createElement("dialog");
    document.body.appendChild(myDialog);
    myDialog.innerHTML = `
    <div style="display:flex;justify-content: center;align-items: center;flex-direction: column;gap:10px;padding:2rem 4rem">
        <div style="text-align:center">
            <img style="width:100px;height:100px" src="https://magic-scripts.vercel.app/tg.webp"
                >
        </div>
        <div style="color:black;margin:1rem 0">${cid}</div>
        <div style="font-size:3rem;font-weight:bolder;color:red">LOCKED</div>
    </div>
    <hr>
    <div style="text-align:center;padding:1rem 0">💙 Made by @feiugum 💙</div>`;
    myDialog.style = "border:none;outline:none;margin:auto";
    myDialog.showModal();
}
  </script>
</body>
